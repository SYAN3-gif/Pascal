<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pascal-blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3b82f6" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>
  </defs>

  <g fill="currentColor" stroke="currentColor">
    <!-- Top Sweeping Protective Crescent Arc -->
    <path
      d="M 185 125 C 255 80, 335 100, 345 202 C 335 145, 270 95, 185 125 Z"
      stroke="none"
    />

    <!-- Main Capital 'P' Structure -->
    <!-- Top Horizontal Serif Bar -->
    <path
      d="M 200 140 L 285 140 C 275 140, 260 140, 250 140 L 215 140 Z"
      strokeWidth="6"
      strokeLinecap="round"
    />

    <!-- Vertical Stem of 'P' -->
    <path
      d="M 215 140 L 240 140 L 240 275 L 215 275 Z"
      stroke="none"
    />

    <!-- Base Serif of 'P' -->
    <path
      d="M 200 275 L 255 275 L 255 285 C 240 285, 235 280, 227 280 C 220 280, 215 285, 200 285 Z"
      stroke="none"
    />

    <!-- Facial Profile Silhouette (Right side of 'P') -->
    <path
      d="M 285 140 
         C 296 155, 300 170, 300 185
         C 300 189, 303 193, 306 197
         C 311 204, 312 208, 306 212
         C 302 215, 304 219, 307 222
         C 304 225, 302 227, 304 230
         C 306 233, 300 238, 294 242
         C 285 248, 275 246, 262 250
         C 255 252, 252 260, 250 266"
      fill="none"
      strokeWidth="4"
      strokeLinecap="round"
      strokeLinejoin="round"
    />

    <!-- Left Circuit Traces & Nodes -->
    <!-- Node & Trace 1 (Top) -->
    <circle cx="175" cy="148" r="5" stroke="none" />
    <path d="M 175 148 L 215 148" fill="none" strokeWidth="4" strokeLinecap="round" />

    <!-- Isolated Node Dot -->
    <circle cx="150" cy="172" r="5" stroke="none" />

    <!-- Node & Trace 2 (Middle Upper Stepped) -->
    <circle cx="138" cy="196" r="5" stroke="none" />
    <path
      d="M 138 196 L 175 196 L 195 180 L 215 180"
      fill="none"
      strokeWidth="4"
      strokeLinecap="round"
      strokeLinejoin="round"
    />

    <!-- Node & Trace 3 (Middle Lower leading into Ear Port) -->
    <circle cx="165" cy="226" r="5" stroke="none" />
    <path
      d="M 165 226 L 190 205 L 236 205"
      fill="none"
      strokeWidth="4"
      strokeLinecap="round"
      strokeLinejoin="round"
    />

    <!-- Ear Port / Sensor -->
    <circle cx="248" cy="205" r="14" fill="none" strokeWidth="4" />
    <circle cx="248" cy="205" r="7" stroke="none" />

    <!-- Trace 4 (Bottom-left Vertical drop) -->
    <path
      d="M 190 230 L 190 258"
      fill="none"
      strokeWidth="3.5"
      strokeLinecap="round"
    />

    <!-- Typography: P Λ S C Λ L -->
    <!-- 'P' -->
    <path d="M 118 360 L 118 392 M 118 360 L 132 360 C 140 360, 144 365, 144 372 C 144 379, 140 384, 132 384 L 118 384" fill="none" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />
    
    <!-- 'Λ' (First Lambda) -->
    <path d="M 160 392 L 176 360 L 192 392" fill="none" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />

    <!-- 'S' -->
    <path d="M 230 367 C 224 361, 214 360, 210 365 C 205 370, 208 375, 216 377 C 228 380, 230 384, 227 389 C 223 394, 212 393, 205 388" fill="none" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />

    <!-- 'C' -->
    <path d="M 276 367 C 270 361, 258 360, 252 367 C 245 375, 245 382, 252 389 C 258 395, 270 394, 276 388" fill="none" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />

    <!-- 'Λ' (Second Lambda) -->
    <path d="M 308 392 L 324 360 L 340 392" fill="none" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />

    <!-- 'L' -->
    <path d="M 362 360 L 362 392 L 384 392" fill="none" strokeWidth="5.5" strokeLinecap="round" strokeLinejoin="round" />

    <!-- Tagline: — YOUR INTELLIGENT ASSISTANT — -->
    <!-- Left Dash -->
    <line x1="116" y1="412" x2="135" y2="412" strokeWidth="2.5" strokeLinecap="round" />
    
    <!-- Right Dash -->
    <line x1="365" y1="412" x2="384" y2="412" strokeWidth="2.5" strokeLinecap="round" />
  </g>

  <!-- Tagline Text in crisp geometric font -->
  <text
    x="250"
    y="415"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="3.5"
    fill="currentColor"
    opacity="0.9"
  >
    YOUR INTELLIGENT ASSISTANT
  </text>
</svg>
